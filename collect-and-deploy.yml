name: Collect and deploy real-time board

on:
  schedule:
    # 매일 00:25 KST(=15:25 UTC 전날) 실제 값 수집.
    # GitHub 스케줄은 지연될 수 있으므로, 화면에는 예약 시각이 아니라
    # 실제 조회 시각(fetched_at)을 그대로 기록/표시합니다.
    - cron: "25 15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 실제 값 수집 (실패해도 워크플로는 계속 진행 → 마지막 정상값 보존)
        run: node scripts/collect.mjs
        continue-on-error: true

      - name: 변경 여부 확인
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 공개 기록 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "aleph-t04-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): daily collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pages 아티팩트 업로드 (루트 전체 = 정적 사이트)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
