<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지금, 우리 동네 공기 — 대구 초미세먼지(PM2.5)</title>
<meta name="description" content="비개인 공개 원천(Open-Meteo 대기질 API)으로 지금 이 순간 대구의 초미세먼지(PM2.5) 농도를 매일 기록하고, 데이터가 오지 않을 때도 정직하게 상태를 보여주는 정보판" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-theme="day">
 
  <!-- 배경: 시간대별 하늘 + 해/달 + 미세먼지 뿌연 효과 -->
  <div class="sky-backdrop" aria-hidden="true">
    <div class="sky-stars"></div>
    <div class="sky-orb" id="sky-orb"></div>
    <div class="haze-layer" id="haze-layer"></div>
  </div>
 
  <div class="dashboard">
    <header class="dash-header">
      <div>
        <h1>지금, 우리 동네 공기</h1>
        <p class="dash-sub">대구 초미세먼지(PM2.5) · <span id="theme-label">낮</span> 하늘</p>
      </div>
      <div id="air-badge" class="air-badge">불러오는 중…</div>
    </header>
 
    <main class="dash-grid">
      <!-- 왼쪽: 실제 공개 기록 -->
      <section class="panel" id="public-record-card" aria-labelledby="public-record-title">
        <h2 id="public-record-title">지금까지의 기록 <span class="badge badge-live">실제 데이터</span></h2>
 
        <div id="latest-reading" class="reading-block" aria-live="polite">
          <p class="loading">불러오는 중…</p>
        </div>
 
        <div class="table-scroll">
          <table class="records-table" id="records-table">
            <thead>
              <tr>
                <th>날짜(KST)</th>
                <th>PM2.5</th>
                <th>출처 시각</th>
                <th>조회 시각</th>
                <th>대조</th>
              </tr>
            </thead>
            <tbody id="records-tbody">
              <tr><td colspan="5">불러오는 중…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
 
      <!-- 오른쪽: 다섯 가지 실패 + 복구 -->
      <section class="panel" id="synthetic-card" aria-labelledby="synthetic-title">
        <h2 id="synthetic-title">신호가 끊기면? <span class="badge badge-synthetic">가짜 상황극</span></h2>
 
        <div class="replay-steps">
          <button class="btn" data-fixture="reset">↺ 초기화</button>
          <button class="btn" data-fixture="normal-d1-a">1일차(100)</button>
          <button class="btn" data-fixture="normal-d1-b">재조회(105)</button>
        </div>
 
        <div class="replay-steps fail-grid">
          <button class="btn btn-fail" data-fixture="timeout"><span class="fail-emoji">🐢</span>느린 응답<small>timeout</small></button>
          <button class="btn btn-fail" data-fixture="auth-401"><span class="fail-emoji">🔒</span>문 안 열어줌<small>401</small></button>
          <button class="btn btn-fail" data-fixture="rate-429"><span class="fail-emoji">🙅</span>제지당함<small>429</small></button>
          <button class="btn btn-fail" data-fixture="offline"><span class="fail-emoji">📡</span>인터넷 끊김<small>offline</small></button>
          <button class="btn btn-fail" data-fixture="schema-break"><span class="fail-emoji">🧩</span>형식 이상<small>schema</small></button>
        </div>
 
        <div class="replay-steps">
          <button class="btn btn-recover" data-fixture="recover-d2">↻ 다시 시도(복구)</button>
          <button class="btn" data-fixture="normal-d2">다음날(+15)</button>
        </div>
 
        <div id="synthetic-status" class="status-panel" aria-live="polite">
          <p class="loading">순서: 1일차 → 재조회 → 실패 하나 → 다시 시도</p>
        </div>
 
        <div class="table-scroll small">
          <table class="records-table" id="synthetic-table">
            <thead>
              <tr><th>날짜</th><th>값(pt)</th><th>상태</th><th>코드</th></tr>
            </thead>
            <tbody id="synthetic-tbody">
              <tr><td colspan="4">아직 없음</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
 
    <footer class="dash-footer">
      <p>출처: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) · 열쇠 없이 누구나 이용 가능</p>
    </footer>
  </div>
 
  <script type="module" src="app.js"></script>
</body>
</html>
